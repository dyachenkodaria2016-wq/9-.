name: Build and deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4
      - name: Налаштувати Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Встановити залежності та підготувати WebAssembly
        run: npm install
      - name: Перевірити та зібрати застосунок
        run: npm run build
      - name: Завантажити артефакт GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опублікувати сайт
        id: deployment
        uses: actions/deploy-pages@v4
